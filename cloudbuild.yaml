# Submit the repository root, not just backend/typescript.
# Configure the Cloud Run service and run schema migrations before using this pipeline.
substitutions:
  _REGION: us-east1
  _REPOSITORY: recruitment
  _SERVICE: recruitment-api

steps:
  # Fail before building if the one-time service setup has not been completed.
  - id: check-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - describe
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --format=value(metadata.name)

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/typescript/Dockerfile.production
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - backend/typescript

  # Push explicitly: the images section is processed after the deployment step.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
