query InterviewDashboard(
  $pageNumber: Int!
  $resultsPerPage: Int!
  $sortBy: InterviewDashboardSortBy
  $sortAscending: Boolean
) {
  interviewDashboard(
    pageNumber: $pageNumber
    resultsPerPage: $resultsPerPage
    sortBy: $sortBy
    sortAscending: $sortAscending
  ) {
    applicantRecordId
    firstName
    lastName
    position
    applicationStatus
    interviewers {
      firstName
      lastName
    }
    interviewScore
  }
}
