query InterviewInvites(
  $pageNumber: Int!
  $resultsPerPage: Int!
  $status: [InterviewGroupStatus!]
  $filters: InterviewInvitesFilters
) {
  interviewInvites(
    pageNumber: $pageNumber
    resultsPerPage: $resultsPerPage
    status: $status
    filters: $filters
  ) {
    id
    interviewers {
      id
      firstName
      lastName
    }
    interviewees {
      firstName
      lastName
      position
    }
    position
    schedulingLink
    status
  }
}
