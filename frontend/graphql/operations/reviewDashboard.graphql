query ReviewDashboard(
  $pageNumber: Int!
  $resultsPerPage: Int!
  $sortBy: ReviewDashboardSortBy
  $sortAscending: Boolean
  $view: DashboardView
) {
  reviewDashboard(
    pageNumber: $pageNumber
    resultsPerPage: $resultsPerPage
    sortBy: $sortBy
    sortAscending: $sortAscending
    view: $view
  ) {
    applicantRecordId
    firstName
    lastName
    position
    timesApplied
    applicationStatus
    choice
    reviewers {
      id
      firstName
      lastName
      email
      position
      role
      isArchived
    }
    totalScore
  }
}
