query ReviewDashboard($pageNumber: Int!, $resultsPerPage: Int!, $view: DashboardView) {
  reviewDashboard(pageNumber: $pageNumber, resultsPerPage: $resultsPerPage, view: $view) {
    applicantRecordId
    firstName
    lastName
    position
    timesApplied
    applicationStatus
    choice
    reviewers {
      id
      firstName
      lastName
      email
      position
      role
      isArchived
    }
    totalScore
  }
}
