query ReviewDashboardSidePanel($applicantRecordId: ID!) {
  reviewDashboardSidePanel(applicantRecordId: $applicantRecordId) {
    firstName
    lastName
    position
    program
    academicYear
    resumeUrl
    applicationStatus
    skillCategory
    shortlistedForInterview
    isApplicantFlagged
    reviewDetails {
      reviewStatus
      reviewer {
        id
        firstName
        lastName
      }
      review {
        passionFSG
        teamPlayer
        desireToLearn
        skill
        skillCategory
        comments
      }
    }
  }
}
