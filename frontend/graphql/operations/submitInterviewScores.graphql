mutation SubmitInterviewScores($interviewedApplicantRecordId: ID!, $interviewJson: InterviewInput!) {
  submitInterviewScores(interviewedApplicantRecordId: $interviewedApplicantRecordId, interviewJson: $interviewJson) {
    id
    score
    status
    interviewJson {
      passionFSG
      teamPlayer
      desireToLearn
      skill
      skillCategory
      comments
    }
  }
}
